<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Іконки — знак Logo (бірюзовий квадрат з бульбашкою); SVG для сучасних браузерів, ICO і PNG — для решти -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="application-name" content="Chat" />
    <meta name="description" content="Online chat" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#0B7A75" />
    <meta name="msapplication-TileColor" content="#0B7A75" />
    <!-- Смуга браузера — THEME_COLOR з src/theme.ts (тло бічної панелі); скрипт нижче і useThemeColorMeta враховують ручний вибір теми -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151C1D" />
    <title>Chat</title>
    <!-- Статичний аналог ColorSchemeScript: тема ставиться до першого кадру, без мерехтіння. Ключ — COLOR_SCHEME_KEY з src/theme.ts -->
    <script>
      try {
        var scheme = null;
        // Заблоковані дані сайту: localStorage кидає, і тоді тема — за системою
        try {
          scheme = localStorage.getItem('chat-color-scheme');
        } catch (e) {}
        if (scheme !== 'light' && scheme !== 'dark') {
          scheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-mantine-color-scheme', scheme);
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) {
          metas[i].setAttribute('content', scheme === 'dark' ? '#151C1D' : '#FFFFFF');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
